<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>Vishal Chauhan · GitHub activity</title>
<style>
@font-face{font-family:Inter;src:url(assets/fonts/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}:root{--bg:#0a0a0a;--card:#18181b;--line:#3f3f4670;--white:#fafafa;--muted:#a1a1aa;--orange:#f97316;--amber:#ffbd7a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,system-ui,sans-serif}main{max-width:1200px;padding:42px 28px;margin:auto}a{color:inherit;text-decoration:none}a:hover{color:var(--orange)}button,a:focus-visible{outline-offset:5px}button:focus-visible,a:focus-visible{outline:2px solid var(--orange)}.mono{font-family:"SFMono-Regular",Consolas,monospace}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--orange)}button{font:12px "SFMono-Regular",Consolas,monospace;background:transparent;border:1px solid var(--line);border-radius:30px;padding:11px 16px;color:var(--muted);cursor:pointer;white-space:nowrap}.intro{position:relative;margin:28px 0 26px}.intro h1{font-size:32px;margin:0 0 8px;letter-spacing:-.8px;line-height:1.15}.intro p{color:var(--muted);font-size:14px;margin:0;line-height:1.6}.intro .tag{margin-top:15px;font-size:13px}.signal{position:absolute;right:0;top:-30px;width:280px;height:160px;opacity:.55;z-index:-1}.signal path{stroke:var(--amber);stroke-dasharray:6 14;animation:signal 6s linear infinite}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{border:1px solid var(--line);border-radius:28px;background:linear-gradient(135deg,#18181b,#09090b);padding:20px;min-width:0}.stat strong{font-size:42px;letter-spacing:-2px;color:var(--orange);font-weight:600}.stat:nth-child(even) strong{color:var(--amber)}.stat-bottom{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:13px}.muted{color:var(--muted)}.period{font-size:10px;white-space:nowrap}.matrix{margin-top:16px;overflow:hidden}.card-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px}h2{font-size:18px;margin:0;font-weight:600}.total{color:var(--orange);font-size:12px}.calendar-wrap{overflow-x:auto;padding:0 0 5px}.calendar{display:block;min-width:760px;width:100%;height:auto}.snake{animation:snake 6.4s linear infinite}@keyframes snake{from{stroke-dashoffset:32}to{stroke-dashoffset:var(--travel)}}.lower{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:16px}.pulse{width:100%;height:110px;display:block}.trace{stroke-dasharray:9 18;animation:signal 3s linear infinite}.language-track{display:flex;height:9px;border-radius:10px;overflow:hidden;margin:22px 0}.language-track span{position:relative}.language-track span:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff55,transparent);transform:translateX(-100%);animation:glide 4s ease-in-out infinite}.language-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:11px 0}.lang-name{display:flex;align-items:center;gap:9px}.dot{width:7px;height:7px;border-radius:50%;background:var(--orange)}.caption{font-size:11px;color:var(--muted);line-height:1.6;margin:15px 0 0}footer{margin:25px 3px 0;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:20px;line-height:1.8}.links{display:flex;gap:15px;flex-wrap:wrap}.paused *{animation-play-state:paused!important}@keyframes signal{to{stroke-dashoffset:-120}}@keyframes glide{0%,30%{transform:translateX(-100%)}80%,100%{transform:translateX(100%)}}@media(max-width:750px){main{padding:26px 18px}.stats{grid-template-columns:1fr 1fr}.lower{grid-template-columns:1fr}.card{padding:19px}.card-head{align-items:start;flex-direction:column;gap:8px}.intro h1{letter-spacing:-1.5px}.intro p{font-size:15px}.signal{width:150px;opacity:.2}.top .eyebrow{font-size:9px;letter-spacing:1px}footer{flex-direction:column;gap:12px}.stat strong{font-size:36px}.stat-bottom{flex-direction:column;gap:7px}.calendar{min-width:760px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.snake{display:none}.trace{stroke-dasharray:none}}

.navet-card-title{font-size:14px;font-weight:600;margin:0;line-height:20px}.navet-card-subtitle{font-size:12px;color:var(--muted);margin:3px 0 0;line-height:16px}.stat{display:flex;flex-direction:column}.stat>.flex{height:auto;flex:1;margin-top:26px}.stat-note{font-size:11px;color:var(--muted)}.accent-text{color:var(--orange)}.flex{display:flex}.flex-col{flex-direction:column}.h-full{height:100%}.mt-auto{margin-top:auto}.mt-3{margin-top:12px}.pt-3{padding-top:12px}.pt-4{padding-top:16px}.text-2xl{font-size:24px}.text-3xl{font-size:30px}.text-4xl{font-size:36px}.font-bold{font-weight:700}.font-semibold{font-weight:600}.leading-none{line-height:1}.text-sm{font-size:14px}.leading-5{line-height:20px}.mt-1{margin-top:4px}.text-white\/72{color:rgba(255,255,255,.72)}.text-white\/76{color:rgba(255,255,255,.76)}
.eyebrow{text-transform:none;letter-spacing:0;font-family:Inter,system-ui,sans-serif;font-size:13px;color:var(--muted)}.period{font-size:11px;text-transform:none;letter-spacing:0}.stat strong{font-family:Inter,system-ui,sans-serif}.intro h1{letter-spacing:-.8px}@media(max-width:750px){.top .eyebrow{font-size:13px;letter-spacing:0}.intro h1{font-size:28px;letter-spacing:-.7px}.intro p{font-size:13px}.stat-note{line-height:16px}.text-4xl{font-size:30px}.stat>.flex{margin-top:20px}}
</style>
</head>
<body><main>
<header class="top"><span class="eyebrow mono">@awesomestvi</span><button id="motion" aria-pressed="false">Pause motion</button></header>
<section class="intro" aria-labelledby="name"><h1 id="name">Vishal Chauhan</h1><p>Frontend developer &amp; UI/UX designer</p></section>
<div class="stats" id="stats" aria-label="GitHub activity over the past year"><p class="muted">Loading GitHub snapshot…</p></div>
<section class="card matrix" aria-labelledby="matrix-title"><div class="card-head"><h2 id="matrix-title">Contributions</h2><span class="total mono" id="total"></span></div><div class="calendar-wrap" tabindex="0" aria-label="Contribution calendar; scroll horizontally on a small screen"><svg class="calendar" id="calendar" viewBox="0 0 1120 184" role="img" aria-labelledby="calendar-title"><title id="calendar-title">GitHub contribution calendar</title></svg></div><p class="caption mono" id="range"></p></section>
<div class="lower"><section class="card" aria-labelledby="pulse-title"><div class="card-head"><h2 id="pulse-title">Weekly activity</h2><span class="muted mono period">Per week</span></div><svg id="pulse" class="pulse" viewBox="0 0 660 110" role="img" aria-labelledby="pulse-desc"><title id="pulse-desc">Weekly contribution totals</title></svg><p class="caption">Each point shows one week’s contribution total.</p></section><section class="card" aria-labelledby="lang-title"><h2 id="lang-title">Languages</h2><div class="language-track" id="language-track" aria-hidden="true"></div><div id="languages"></div><p class="caption">Public repository bytes · excluding forks</p></section></div>
<footer><span class="mono" id="meta"></span><nav class="links" aria-label="Profile links"><a href="https://github.com/awesomestvi?tab=repositories">Repositories ↗</a><a href="https://github.com/awesomestvi/navet">Building Navet ↗</a><a href="assets/dashboard.png">Still image ↗</a></nav></footer>
</main>
<script>
const colors=['#262b40','#4d3026','#8a4728','#c5652b','#f97316'];
const palette=['#f97316','#ffbd7a','#f5ba7e','#687897'];
const motion=document.getElementById('motion');
motion.addEventListener('click',()=>{const paused=document.body.classList.toggle('paused');motion.textContent=paused?'Resume motion':'Pause motion';motion.setAttribute('aria-pressed',String(paused));});
const ns='http://www.w3.org/2000/svg';
function svgNode(tag,attrs,parent){const node=document.createElementNS(ns,tag);for(const [key,value] of Object.entries(attrs))node.setAttribute(key,value);parent.append(node);return node;}
function write(id,text){document.getElementById(id).textContent=text;}
fetch('data/profile.json').then(r=>{if(!r.ok)throw Error('Snapshot unavailable');return r.json();}).then(async data=>{
 const collection=data.contributionsCollection,calendar=collection.contributionCalendar,weeks=calendar.weeks,days=weeks.flatMap(w=>w.contributionDays);
 let run=0,longest=0;for(const day of days){run=day.contributionCount?run+1:0;longest=Math.max(longest,run);}
 const fragments=await fetch('data/components.json').then(r=>{if(!r.ok)throw Error('Components unavailable');return r.json();});document.getElementById('stats').innerHTML=fragments.stats;
 write('total',`${calendar.totalContributions.toLocaleString()} contributions / past year`);
 const grid=document.getElementById('calendar');let month='';
 weeks.forEach((week,wi)=>{const first=new Date(week.contributionDays[0].date+'T00:00:00Z');const label=first.toLocaleString('en',{month:'short',timeZone:'UTC'});if(label!==month&&wi<weeks.length-2&&!(wi===0&&first.getUTCDate()>21)){svgNode('text',{x:wi*20.5+3,y:15,fill:'#a0a9c2','font-size':11},grid).textContent=label;month=label;}
 for(const day of week.contributionDays){const level=day.contributionCount?Math.min(4,1+Math.floor(Math.log2(day.contributionCount))):0;const rect=svgNode('rect',{x:wi*20.5+3,y:31+day.weekday*19,width:15,height:14,rx:3,fill:colors[level]},grid);svgNode('title',{},rect).textContent=`${day.date}: ${day.contributionCount} contributions`;}});
 const trail=[];for(let wi=Math.max(0,weeks.length-27);wi<weeks.length;wi++){const rows=wi%2===0?[0,1,2,3,4,5,6]:[6,5,4,3,2,1,0];for(const row of rows){if(weeks[wi].contributionDays.some(day=>day.weekday===row))trail.push([wi*20.5+10.5,38+row*19]);}}
 const snakePath=svgNode('path',{d:'M'+trail.map(p=>p.join(',')).join(' L'),fill:'none',stroke:'#fff0d5','stroke-width':3,'stroke-linecap':'round','stroke-dasharray':'32 10000',class:'snake','aria-hidden':'true'},grid);let travel=0;for(let i=1;i<trail.length;i++)travel+=Math.hypot(trail[i][0]-trail[i-1][0],trail[i][1]-trail[i-1][1]);snakePath.style.setProperty('--travel',String(-travel));
 svgNode('text',{x:3,y:180,fill:'#a0a9c2','font-size':10},grid).textContent='Sun → Sat, top to bottom · Less';
 colors.forEach((color,i)=>svgNode('rect',{x:209+i*17,y:171,width:12,height:10,rx:2,fill:color},grid));
 svgNode('text',{x:300,y:180,fill:'#a0a9c2','font-size':10},grid).textContent='More';
 write('range',`${days[0].date} — ${days.at(-1).date} · GitHub-reported activity`);
 const values=weeks.map(w=>w.contributionDays.reduce((sum,d)=>sum+d.contributionCount,0)),max=Math.max(1,...values),points=values.map((v,i)=>`${i*660/(values.length-1)},${95-v/max*83}`),line='M'+points.join(' L');const pulse=document.getElementById('pulse');
 svgNode('path',{d:line+' L660,100 L0,100 Z',fill:'#3d2b26'},pulse);svgNode('path',{d:line,fill:'none',stroke:'#f97316','stroke-width':2},pulse);svgNode('path',{d:line,fill:'none',stroke:'#f1f2fa','stroke-width':2,class:'trace','aria-hidden':'true'},pulse);write('pulse-desc',`Weekly contributions, ranging from ${Math.min(...values)} to ${max} contributions.`);
 const total=data.languages.reduce((s,l)=>s+l.bytes,0)||1;
 data.languages.forEach((language,i)=>{const bar=document.createElement('span');bar.style.width=`${100*language.bytes/total}%`;bar.style.background=palette[Math.min(i,3)];document.getElementById('language-track').append(bar);});
 for(const [i,language] of data.languages.slice(0,3).entries()){const row=document.createElement('div');row.className='language-row';const name=document.createElement('span');name.className='lang-name';const dot=document.createElement('span');dot.className='dot';dot.style.background=palette[i];name.append(dot,document.createTextNode(language.name));const percent=document.createElement('span');percent.className='muted mono';percent.textContent=`${Math.round(100*language.bytes/total)}%`;row.append(name,percent);document.getElementById('languages').append(row);}
 write('meta',`${data.repositories.totalCount} public repos / ${data.stars} stars / ${data.followers.totalCount} followers · Snapshot ${data.updatedAt.slice(0,10)}`);
}).catch(()=>{write('stats','The activity snapshot could not load. Open this preview through a local web server.');});
</script>
</body></html>
